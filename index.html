<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamDock Remote</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>StreamDock Remote</h1><p class="sub">Change le fond du StreamDock à distance.</p>
<section>
<label>Adresse de connexion</label><input id="bridge" placeholder="https://....trycloudflare.com">
<button id="connect">Connexion</button><span id="state">Hors ligne</span>
</section>
<section><h2>Actuellement diffusé</h2><div id="current">Aucun média</div></section>
<section id="drop"><input id="file" type="file" accept="image/*,video/mp4,video/webm,.gif">
<h2>Image / vidéo</h2><p>PNG, JPG, GIF, MP4, WEBM</p><button id="pick">Choisir</button>
<div id="preview"></div><button id="send" disabled>Envoyer au StreamDock</button></section>
</main><script src="app.js"></script></body></html>
